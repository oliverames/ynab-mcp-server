name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Build Docker image
        run: docker build --tag ynab-mcp-ci .
      - name: Docker MCP smoke (offline, no credentials)
        # Mount only the test harness so the server and dependencies come from the image.
        run: |
          docker run --rm --network none \
            --env YNAB_DISABLE_AGENT_CONFIG_FALLBACK=1 \
            --env YNAB_ALLOW_WRITES=0 \
            --mount "type=bind,source=${GITHUB_WORKSPACE}/scripts,target=/app/scripts,readonly" \
            --entrypoint node \
            ynab-mcp-ci scripts/smoke-list-tools.mjs

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix worker --no-audit --no-fund
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Worker dependency audit
        run: npm audit --prefix worker --omit=dev --audit-level=high
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: ["20.x", "22.x", "24.x"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Syntax check
        run: node --check index.js
      - name: Unit tests (offline)
        run: npm run test:unit
      - name: Safety model tests (offline)
        run: npm run test:safety
      - name: Release consistency check
        run: npm run release:check
      - name: MCP smoke - list tools (discovery mode, no credentials)
        run: npm run smoke:list-tools
        env:
          YNAB_DISABLE_AGENT_CONFIG_FALLBACK: "1"

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix worker --no-audit --no-fund
      - name: Worker tests (offline)
        run: npm test
        working-directory: worker
      - name: Validate Worker bundle and Wrangler schema
        run: npx wrangler deploy --dry-run --outdir /tmp/ynab-worker-dry-run
        working-directory: worker
